<svg style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" viewBox="10 10 660 135" xmlns="http://www.w3.org/2000/svg" id="archSvg">
          <defs>
            <!-- Drop Shadow for Nodes -->
            <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
            <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="#059669"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
            <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>

            <!-- Gradients -->
            <linearGradient id="grad-vpc" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2563eb" stop-opacity="0.03"/>
              <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.03"/>
            </linearGradient>

            <linearGradient id="grad-iap" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e11d48"/>
              <stop offset="100%" stop-color="#be123c"/>
            </linearGradient>

            <linearGradient id="grad-icmp" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#059669"/>
              <stop offset="100%" stop-color="#047857"/>
            </linearGradient>

            <linearGradient id="grad-vm-a" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#eff6ff"/>
              <stop offset="100%" stop-color="#dbeafe"/>
            </linearGradient>

            <linearGradient id="grad-vm-b" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5f3ff"/>
              <stop offset="100%" stop-color="#ede9fe"/>
            </linearGradient>
          </defs>
  <rect x=\"0\" y=\"0\" width=\"680\" height=\"440\" rx=\"16\" fill=\"#ffffff\"/>

          <!-- 1. GROUP CONTAINERS -->
          <!-- VPC Boundary -->
          <rect id="node-vpc" class="interactive-node" data-category="network" data-res="vpc"
                x="18" y="18" width="644" height="404" rx="16"
                fill="url(#grad-vpc)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/>
          <text x="340" y="38" text-anchor="middle"
                font-size="12" font-weight="700" fill="#2563eb" letter-spacing="0.5" pointer-events="none">
            ☁️ GCP PROJECT: my-devops-journey-502420  |  VPC: lab-vpc
          </text>

          <!-- Region Container -->
          <rect x="36" y="145" width="608" height="260" rx="12"
                fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" pointer-events="none"/>
          <text x="340" y="165" text-anchor="middle"
                font-size="12" font-weight="600" fill="#64748b" pointer-events="none">
            📍 REGION: us-central1 (Zone: us-central1-a)
          </text>

          <!-- Subnet A Container -->
          <g id="node-subnet-a" class="interactive-node" data-category="network" data-res="subnet-a">
            <rect x="52" y="182" width="276" height="208" rx="10"
                  fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
            <rect x="52" y="182" width="276" height="32" rx="10" fill="#eff6ff"/>
            <text x="190" y="202" text-anchor="middle"
                  font-size="12" font-weight="700" fill="#1e40af">
              🌐 subnet-a &bull; 10.10.0.0/24
            </text>
          </g>

          <!-- Subnet B Container -->
          <g id="node-subnet-b" class="interactive-node" data-category="network" data-res="subnet-b">
            <rect x="352" y="182" width="276" height="208" rx="10"
                  fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
            <rect x="352" y="182" width="276" height="32" rx="10" fill="#f5f3ff"/>
            <text x="490" y="202" text-anchor="middle"
                  font-size="12" font-weight="700" fill="#5b21b6">
              🌐 subnet-b &bull; 10.10.1.0/24
            </text>
          </g>

          <!-- 2. CONNECTORS -->
          <!-- IAP SSH Traffic Stream down to VM A -->
          <line x1="190" y1="116" x2="190" y2="226"
                stroke="#e11d48" stroke-width="1.8"
                marker-end="url(#arrow-blue)" fill="none"/>

          <!-- IAP SSH Branch to VM B -->
          <path d="M 190 122 C 190 140, 490 140, 490 226"
                stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3"
                marker-end="url(#arrow-blue)" fill="none"/>

          <!-- Internal ICMP Line to Region -->
          <line x1="490" y1="116" x2="490" y2="145"
                stroke="#059669" stroke-width="1.5"
                marker-end="url(#arrow-emerald)" fill="none"/>

          <!-- ICMP Bidirectional Ping Line -->
          <line x1="298" y1="258" x2="382" y2="258"
                stroke="#059669" stroke-width="1.8"
                marker-end="url(#arrow-emerald)" marker-start="url(#arrow-emerald)" fill="none"/>

          <!-- 3. NODES & CARDS -->

          <!-- Firewall Rule: allow-iap-ssh (Hero Crimson) -->
          <g id="node-fw-iap" class="interactive-node" data-category="security" data-res="fw-iap">
            <rect x="52" y="58" width="276" height="58" rx="10"
                  fill="url(#grad-iap)" stroke="#be123c" stroke-width="1" filter="url(#card-shadow)"/>
            <text x="190" y="78" text-anchor="middle" dominant-baseline="central"
                  font-size="13" font-weight="700" fill="#ffffff">🛡️ allow-iap-ssh (TCP 22)</text>
            <text x="190" y="98" text-anchor="middle" dominant-baseline="central"
                  font-size="11" font-weight="500" fill="#ffe4e6">Source: 35.235.240.0/20 (IAP Tunnel)</text>
          </g>

          <!-- Firewall Rule: allow-internal-icmp (Hero Emerald) -->
          <g id="node-fw-icmp" class="interactive-node" data-category="security" data-res="fw-icmp">
            <rect x="352" y="58" width="276" height="58" rx="10"
                  fill="url(#grad-icmp)" stroke="#047857" stroke-width="1" filter="url(#card-shadow)"/>
            <text x="490" y="78" text-anchor="middle" dominant-baseline="central"
                  font-size="13" font-weight="700" fill="#ffffff">🔄 allow-internal-icmp (ICMP)</text>
            <text x="490" y="98" text-anchor="middle" dominant-baseline="central"
                  font-size="11" font-weight="500" fill="#d1fae5">Source: 10.10.0.0/16 (VPC Supernet)</text>
          </g>

          <!-- Instance: vm-a -->
          <g id="node-vm-a" class="interactive-node" data-category="compute" data-res="vm-a">
            <rect x="72" y="228" width="236" height="60" rx="8"
                  fill="url(#grad-vm-a)" stroke="#bfdbfe" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="190" y="248" text-anchor="middle" dominant-baseline="central"
                  font-size="13" font-weight="700" fill="#1e3a8a">⚡ vm-a (e2-micro)</text>
            <text x="190" y="268" text-anchor="middle" dominant-baseline="central"
                  font-size="11" font-weight="500" fill="#3b82f6">Debian 12 &bull; Zone us-central1-a</text>
          </g>

          <!-- Instance: vm-b -->
          <g id="node-vm-b" class="interactive-node" data-category="compute" data-res="vm-b">
            <rect x="372" y="228" width="236" height="60" rx="8"
                  fill="url(#grad-vm-b)" stroke="#ddd6fe" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="490" y="248" text-anchor="middle" dominant-baseline="central"
                  font-size="13" font-weight="700" fill="#4c1d95">⚡ vm-b (e2-micro)</text>
            <text x="490" y="268" text-anchor="middle" dominant-baseline="central"
                  font-size="11" font-weight="500" fill="#7c3aed">Debian 12 &bull; Zone us-central1-a</text>
          </g>

          <!-- Inter-Subnet Ping Pulse Badge -->
          <g>
            <rect x="290" y="294" width="100" height="28" rx="14"
                  fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#card-shadow)"/>
            <text x="340" y="308" text-anchor="middle" dominant-baseline="central"
                  font-size="10" font-weight="700" fill="#047857">📡 ICMP Ping</text>
          </g>

          <!-- Output Badge (vm_b_ip) -->
          <g id="node-output" class="interactive-node" data-category="compute" data-res="output">
            <rect x="372" y="326" width="236" height="36" rx="8"
                  fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.2"/>
            <text x="490" y="344" text-anchor="middle" dominant-baseline="central"
                  font-size="11" font-weight="700" fill="#a21eaf">💎 Output: vm_b_ip (Dynamic)</text>
          </g>
        </svg>