<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">Acme Sample App detailed system overview</title><desc id="desc">Runtime request flow, GCP platform services, Terraform ownership, and Consul contracts.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#455a64"/></marker><marker id="d" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7e57c2"/></marker><style>.title{font:700 26px sans-serif;fill:#17202a;text-anchor:middle}.h{font:700 18px sans-serif;fill:#17202a;text-anchor:middle}.t{font:13px sans-serif;fill:#34495e;text-anchor:middle}.small{font:12px sans-serif;fill:#455a64;text-anchor:middle}.box{stroke-width:2}.flow{fill:none;stroke:#455a64;stroke-width:2.4;marker-end:url(#a)}.contract{fill:none;stroke:#7e57c2;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#d)}.own{font:700 12px sans-serif;fill:#fff;text-anchor:middle}.lane{stroke-width:2;rx:16}</style></defs>
