{{- if .Values.externalSecrets.enabled -}}
# Delivery half of the SSO secret lifecycle:
#   infrastructure/infra/secrets.tf  created the SM secret
#   backend/infra/iam.tf             granted this SA secretAccessor
#   this ExternalSecret              syncs SM -> Secret -> pod env
# See KubernetesConcepts lab-12 for the teaching version of this pattern.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "acme-sampleapp-backend.fullname" . }}-sso
  labels:
    {{- include "acme-sampleapp-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore | required "externalSecrets.clusterSecretStore is required when externalSecrets.enabled" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | required "externalSecrets.remoteKey is required when externalSecrets.enabled" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | required "externalSecrets.remoteKey is required when externalSecrets.enabled" }}
        property: client_secret
{{- end -}}
