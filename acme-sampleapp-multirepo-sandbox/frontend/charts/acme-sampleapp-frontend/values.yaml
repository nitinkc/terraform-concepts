# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# ──────────────────────────────────────────────
# Frontend (Angular build served by nginx)
# ──────────────────────────────────────────────
frontend:
  replicaCount: 1

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  containerPort: 80

  # Rendered into a runtime config.json by the nginx container's entrypoint
  # script at startup (docker-entrypoint.d), NOT baked into the Angular build —
  # this is what lets one image be promoted dev -> qa -> prod unchanged.
  env: []

  resources: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101 # nginx user
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ──────────────────────────────────────────────
# Ingress (GCE ingress class, backed by the static IP from infra/vip.tf)
# ──────────────────────────────────────────────
ingress:
  enabled: true
  className: "gce"
  # -- Set by Terraform to the static IP resource's name (frontend/infra/vip.tf),
  # not the IP address itself — the GCE ingress controller resolves the name.
  staticIpName: ""
  host: ""
  tls: true

# ──────────────────────────────────────────────
# Common
# ──────────────────────────────────────────────
imagePullSecrets: []

serviceAccount:
  create: false
  name: ""
  annotations: {}
