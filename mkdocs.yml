site_name: Terraform Learning
site_description: An incremental Terraform learning path — theory, local labs, GCP labs, and a multi-repo GKE/Helm sandbox
docs_dir: docs
repo_url: https://github.com/nitinkc/terraform-concepts
repo_name: nitinkc/terraform-concepts

theme:
  name: material
  features:
    # Navigation
    - navigation.tabs
#    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes      # section landing pages (quiz/, sessions/)
    - navigation.path
    - navigation.top           # Back-to-top button
    - navigation.footer        # Prev/Next page links
    # navigation.instant disabled — breaks live reload (re-enable for production builds)
    # - navigation.instant
    # - navigation.instant.progress
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate    # (1) style code annotations
    - content.tabs.link        # Sync tabs across page
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - mkdocs_quiz
  - quizdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      guess_lang: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: On this page
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path:
        - docs
        - .            # lets docs pages single-source the sandbox README/RUNBOOK
      check_paths: true
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

# The personal learner-state assessment lives under docs/sessions/ so it sits next to the
# session notes it summarises, but it is deliberately kept out of the published site.
# Note: this repo is public, so these files are still readable on GitHub — excluding them
# here reduces discoverability, not exposure.
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  sessions/learner-state.md
  sessions/archive/

