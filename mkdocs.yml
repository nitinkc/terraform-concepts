site_name: Terraform Learning
site_description: An incremental Terraform learning path — theory, local labs, GCP labs, and a multi-repo GKE/Helm sandbox
docs_dir: docs
repo_url: https://github.com/nitinkc/terraform-concepts
repo_name: nitinkc/terraform-concepts

theme:
  name: material
  features:
    # Navigation
    - navigation.tabs
#    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes      # section landing pages (reference/, quiz/)
    - navigation.path
    - navigation.top           # Back-to-top button
    - navigation.footer        # Prev/Next page links
    # navigation.instant disabled — breaks live reload (re-enable for production builds)
    # - navigation.instant
    # - navigation.instant.progress
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate    # (1) style code annotations
    - content.tabs.link        # Sync tabs across page
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - mkdocs_quiz
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      guess_lang: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: On this page
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path:
        - docs
        - .            # lets docs pages single-source the sandbox README/RUNBOOK
      check_paths: true
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  acme-labs/

nav:
  - Home: index.md
  - Architect's Reference:
      - reference/index.md
      - 1. Execution Model, Providers & Auth: reference/01-execution-model-and-providers.md
      - 2. Resources, State & Backends: reference/02-resources-state-and-backends.md
      - 3. Identity, Change & Lifecycle: reference/03-identity-lifecycle-and-change.md
      - 4. Dependencies & Graph: reference/04-dependencies-and-graph.md
      - 5. Variables, Locals & Security: reference/05-variables-locals-and-security.md
      - 6. Expressions, Conditionals & Guards: reference/06-expressions-conditionals-and-guards.md
      - 7. Repetition — count, for_each & dynamic: reference/07-repetition-count-for-each-dynamic.md
      - 8. Data Sources, Outputs & Modules: reference/08-data-sources-outputs-and-modules.md
      - 9. State Surgery, Drift & Workspaces: reference/09-state-surgery-drift-and-workspaces.md
      - 10. Multi-Repo, GKE, Networking & CI/CD: reference/10-architecture-multirepo-gke-and-cicd.md
      - 11. Master HCL, CLI & Glossary Cheatsheet: reference/11-cli-and-hcl-cheatsheet.md
  - Sandbox:
      - sandbox/index.md
      - Runbook: sandbox/runbook.md
  - Quiz:
      - quiz/index.md
      - Providers & auth: quiz/01-providers-and-auth.md
      - Resources, state & drift: quiz/02-resources-state-and-drift.md
      - Variables, expressions & guards: quiz/03-variables-expressions-and-guards.md
      - Multi-repo & Consul: quiz/04-multirepo-and-consul.md
      - GKE & Workload Identity: quiz/05-gke-and-workload-identity.md
      - Debugging & verification: quiz/06-debugging-and-verification.md